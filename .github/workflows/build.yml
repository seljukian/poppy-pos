name: Build Poppy POS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper
      run: |
        mvn -version || true
        gradle --version || true
        # Doğrudan sistemdeki Gradle yerine uygun sürümle wrapper üretelim
        npx --yes @antv/g 2>/dev/null || true
        # Gradle 8.5 wrapper dosyalarını doğrudan repo kökünden oluşturalım
        python3 -c "
        import urllib.request, zipfile, io, os
        url = 'https://services.gradle.org/distributions/gradle-8.5-bin.zip'
        print('Downloading Gradle 8.5...')
        resp = urllib.request.urlopen(url)
        with zipfile.ZipFile(io.BytesIO(resp.read())) as z:
            z.extractall('.')
        os.system('./gradle-8.5/bin/gradle wrapper --gradle-version 8.5')
        "

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
